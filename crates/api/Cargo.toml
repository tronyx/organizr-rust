[package]
name = "organizr-api"
description = "The HTTP API of Organizr: router, response envelope, extractors, error type and handlers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The routes of extensions: WebAssembly components in the data folder.
wasm-plugins = ["organizr-plugins/wasm-plugins", "dep:sha2"]

[dependencies]
organizr-auth.workspace = true
organizr-db.workspace = true
organizr-domain.workspace = true
organizr-integrations.workspace = true
organizr-plugins.workspace = true
organizr-settings.workspace = true

arc-swap.workspace = true
axum = { workspace = true, features = ["multipart"] }
form_urlencoded.workspace = true
hex.workspace = true
ipnet.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
jiff.workspace = true
zip.workspace = true
md-5.workspace = true
serde.workspace = true
sha2 = { workspace = true, optional = true }
serde_json.workspace = true
subtle.workspace = true
surge-ping.workspace = true
thiserror.workspace = true
# The lock that puts changes of the settings in a row, the files of uploaded pictures
# and of backups, the connections and the time limit of a ping, and the tasks that send
# e-mails.
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
organizr-testkit.workspace = true

tempfile.workspace = true
tokio.workspace = true
tower.workspace = true
# The fixture test must keep key order and parse floats bit for bit.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
