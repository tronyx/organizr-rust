[package]
name = "organizr-testkit"
description = "Test helpers for Organizr: a database per engine, the seed of the recorded cases and the replay of recorded PHP answers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
organizr-api.workspace = true
organizr-auth.workspace = true
organizr-db.workspace = true
organizr-domain.workspace = true
organizr-plugins.workspace = true
organizr-settings.workspace = true

axum = { workspace = true, features = ["tokio", "http1", "json"] }
# The stand-in OpenID Connect provider: its key, its tokens and its forms.
base64.workspace = true
form_urlencoded.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
jiff.workspace = true
openidconnect.workspace = true
# The stand-ins over HTTPS.
rustls.workspace = true
tokio-rustls.workspace = true
sea-orm.workspace = true
serde.workspace = true
sha2.workspace = true
# The replay must keep key order and parse floats bit for bit.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time"] }
tower.workspace = true

[dev-dependencies]
tokio.workspace = true
