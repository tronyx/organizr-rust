[package]
name = "organizr-plugins"
description = "The plugin interface of Organizr and its bundled plugins."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The host of extensions: WebAssembly components that answer requests.
wasm-plugins = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
organizr-integrations.workspace = true
organizr-settings.workspace = true

lettre.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }

[dev-dependencies]
organizr-testkit.workspace = true

tokio = { workspace = true, features = ["time"] }
