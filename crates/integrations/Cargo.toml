[package]
name = "organizr-integrations"
description = "Clients for the external services Organizr shows on its homepage, one module per service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
jiff.workspace = true
ldap3.workspace = true
md-5.workspace = true
openidconnect.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pki-types.workspace = true
semver.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha1.workspace = true
suppaftp.workspace = true
thiserror.workspace = true
# The time limits of the LDAP and FTP back ends.
tokio = { workspace = true, features = ["time"] }
tokio-rustls.workspace = true
tracing.workspace = true
x509-parser.workspace = true

[dev-dependencies]
organizr-testkit.workspace = true

# The stand-ins of the media servers in the tests of the login back ends.
axum = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros", "net", "io-util"] }
