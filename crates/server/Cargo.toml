[package]
name = "organizr"
description = "Organizr: a dashboard that organises self-hosted web applications into tabs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Puts the built web interface (the folder `web/dist`) into the binary. Build the
# interface first: `npm ci` and `npm run build` in the folder `web`.
embedded-web = ["dep:rust-embed"]

[dependencies]
organizr-api.workspace = true
organizr-auth.workspace = true
organizr-db.workspace = true
organizr-settings.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
rust-embed = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "io-util", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tower.workspace = true
