[package]
name = "organizr"
description = "Organizr: a dashboard that organizes self-hosted web applications into tabs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Puts the built web interface (the folder `web/dist`) into the binary. Build the
# interface first: `npm ci` and `npm run build` in the folder `web`.
embedded-web = ["dep:rust-embed"]
# The host of extensions: WebAssembly components in the data folder.
wasm-plugins = ["organizr-api/wasm-plugins"]

[dependencies]
organizr-api.workspace = true
organizr-auth.workspace = true
organizr-db.workspace = true
organizr-import.workspace = true
organizr-integrations.workspace = true
organizr-plugins.workspace = true
organizr-settings.workspace = true
serde_json.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jiff.workspace = true
rust-embed = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "io-util", "time", "sync"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
organizr-testkit.workspace = true
http-body-util.workspace = true
sea-orm.workspace = true
tempfile.workspace = true
