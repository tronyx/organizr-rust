# The PHP reference for the parity tests. Start it, record, and throw it away:
#
#   docker compose -f parity/oracle/compose.yml up --build --detach
#   python parity/recorder/record.py
#   docker compose -f parity/oracle/compose.yml down --volumes
#
# It listens on this machine only. Its data lives in the container, so every start is a
# fresh, empty install.
name: organizr-parity

services:
  oracle:
    build: .
    ports:
      - "127.0.0.1:8098:80"

  # Takes every e-mail that the reference sends and keeps it, so the recorder can read
  # what PHP wrote. The reference reaches it as `mailpit:1025`, without encryption.
  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports:
      - "127.0.0.1:8099:8025"
