# Organizr with PostgreSQL: two containers.
#
# Before the first start, replace change-me-database-password in BOTH places with a
# password of your own. Make one with:
#   openssl rand -hex 24
# (Hex digits need no escaping in the URL. Other special characters must be
# percent-encoded there, for example @ as %40.)
#
# Save this file as compose.yaml in a new folder (for example "organizr"), then run
# this in that folder:
#   docker compose up -d
#   docker compose logs organizr | grep "set-up code"
# Compose puts the folder name in front of the names: the volumes become
# <folder>_organizr-data and <folder>_organizr-database.
# Every setting of the container is in docs/configuration.md.
services:
  organizr:
    image: ghcr.io/tronyx/organizr-rust:develop
    restart: unless-stopped
    depends_on:
      database:
        # Organizr connects once at start, so it waits until PostgreSQL is ready.
        condition: service_healthy
    ports:
      # Plain HTTP. Never forward it from your router. Behind a reverse proxy with
      # HTTPS, remove these two lines (see compose.sqlite.yaml and
      # docs/reverse-proxy.md, also for ORGANIZR_TRUSTED_PROXIES).
      - "8080:8080"
    environment:
      ORGANIZR_DATABASE_URL: postgres://organizr:change-me-database-password@database:5432/organizr
    volumes:
      # The key for the stored secrets (secret.key), the uploaded pictures, the logs
      # and the backups. Keep it also with PostgreSQL: without secret.key, the
      # stored secrets in the database cannot be read.
      - organizr-data:/config
    # Behind a reverse proxy, trust only the address of the proxy itself, and remove
    # the "ports:" lines above. Never trust a whole Docker range such as 172.16.0.0/12
    # while port 8080 is published: every other container, and on some setups every
    # client of the published port, could then fake its address. To find the
    # address of your proxy container:
    #   docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' <proxy>
    # See docs/reverse-proxy.md for a fixed address that survives restarts.
    # Add these under "environment:" above:
    #   ORGANIZR_TRUSTED_PROXIES: "172.20.0.2"   # the address of your proxy
    #   ORGANIZR_ALLOWED_HOSTS: "organizr.example.com,192.168.1.10:8080"   # for service addresses like /sonarr
    #   TZ: "America/New_York"                   # your time zone, for the schedules

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: organizr
      POSTGRES_PASSWORD: change-me-database-password
      POSTGRES_DB: organizr
    volumes:
      - organizr-database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username organizr --dbname organizr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  organizr-data:
  organizr-database:
