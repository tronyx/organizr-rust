# cargo-deny configuration: security advisories, licences, banned crates and sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # An "unmaintained" notice, not a vulnerability. chrono arrives through
    # sea-orm-migration, which turns on the default date types of SeaORM. The code of
    # this project does not use chrono. Remove this entry when SeaORM drops it.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; it is a dependency of sea-orm-migration and is not used by this project's code" },
]

[licenses]
version = 2
confidence-threshold = 0.8
# Licences that may be combined with this GPL-3.0 project.
allow = [
    "0BSD",
    "MIT",
    "Apache-2.0",
    # The runtime for extensions. The exception lets its code be linked into other work.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# The workspace crates are not published and carry the project's own licence.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl", reason = "TLS uses rustls; the image must not need OpenSSL" },
    { crate = "openssl-sys", reason = "TLS uses rustls; the image must not need OpenSSL" },
    { crate = "native-tls", reason = "TLS uses rustls; the image must not need OpenSSL" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
