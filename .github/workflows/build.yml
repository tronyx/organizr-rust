name: build

# Builds the image for both architectures, tests that it starts, and publishes it.
# It runs on request (Run workflow), for each push to main, and for a pull request to main
# that changes a file of the image. It has no daily run: the image of develop is built on
# request, to save the minutes of GitHub Actions.
# A run for the branch develop publishes ghcr.io/<owner>/<repository>:develop.
# A run for the branch main publishes :latest and :<version of the workspace>.
# No image is published when the scan finds a vulnerability that has a correction.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - docker/**
      - crates/**
      - web/**
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test the image (${{ matrix.architecture }})
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - architecture: linux-amd64
            runner: ubuntu-26.04
          - architecture: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: organizr-smoke-test:${{ matrix.architecture }}
    outputs:
      # Both architectures give the same values.
      channel: ${{ steps.prep.outputs.channel }}
      version: ${{ steps.prep.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the Dockerfile and rust-toolchain.toml name the same Rust version
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          image=$(sed -n 's/^ARG RUST_IMAGE=rust:\([0-9.]*\)-.*$/\1/p' docker/Dockerfile)
          echo "rust-toolchain.toml: ${toolchain}"
          echo "docker/Dockerfile:   ${image}"
          if [[ -z "${toolchain}" || "${toolchain}" != "${image}" ]]; then
            echo "::error::The Rust versions differ. Update both files together."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb

      - name: Prepare
        id: prep
        run: |
          # GITHUB_REF_NAME is N/merge on pull requests. A pull request reads the cache of
          # the branch that it goes into, and never writes a cache, so a pull request
          # can't change what a later build of a branch reuses.
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            CACHE_REF_NAME="${GITHUB_BASE_REF}"
          else
            CACHE_REF_NAME="${GITHUB_REF_NAME}"
          fi
          # Only a run for the branch develop or main publishes, and never a run for a
          # pull request. The channel is the tag that the image of the branch gets.
          PUBLISH=false
          CHANNEL=none
          if [[ "${GITHUB_EVENT_NAME}" != pull_request ]]; then
            case "${GITHUB_REF}" in
              refs/heads/develop) PUBLISH=true; CHANNEL=develop ;;
              refs/heads/main) PUBLISH=true; CHANNEL=latest ;;
            esac
          fi
          ARCHITECTURE=${{ matrix.architecture }}
          {
            echo "publish=${PUBLISH}"
            echo "channel=${CHANNEL}"
            echo "registry_image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "platform=${ARCHITECTURE//-/\/}"
            echo "cache=type=gha,scope=${CACHE_REF_NAME}-${ARCHITECTURE}"
            if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
              echo "cache_to="
            else
              echo "cache_to=type=gha,scope=${CACHE_REF_NAME}-${ARCHITECTURE},mode=max"
            fi
            echo "version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          } >> "$GITHUB_OUTPUT"

      - name: Build for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          platforms: ${{ steps.prep.outputs.platform }}
          cache-from: ${{ steps.prep.outputs.cache }}
          cache-to: ${{ steps.prep.outputs.cache_to }}
          tags: ${{ env.IMAGE }}

      - name: Smoke test
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          PLATFORM: ${{ steps.prep.outputs.platform }}
        run: |
          set -euo pipefail

          echo "The binary starts and reports the version of the workspace"
          output=$(docker run --rm "${IMAGE}" --version)
          echo "${output}"
          [[ "${output}" == "organizr ${VERSION}" ]]

          echo "The image is for ${PLATFORM}"
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE}")" == "${PLATFORM}" ]]

          echo "The image does not run as root"
          [[ "$(docker image inspect --format '{{.Config.User}}' "${IMAGE}")" == "65532:65532" ]]

          echo "The server starts and becomes healthy"
          docker run --detach --name organizr-smoke --publish 127.0.0.1:8080:8080 "${IMAGE}"
          health=starting
          for _ in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' organizr-smoke)
            if [[ "${health}" != "starting" ]]; then break; fi
            sleep 2
          done
          docker logs organizr-smoke
          [[ "${health}" == "healthy" ]]

          echo "The server answers the ping"
          answer=$(curl --silent --fail http://127.0.0.1:8080/api/v2/ping | tr -d '[:space:]')
          echo "${answer}"
          [[ "${answer}" == '{"response":{"result":"success","message":null,"data":"pong"}}' ]]

          echo "The server hands out the web interface with its security policy"
          page=$(curl --silent --fail --dump-header page-headers.txt http://127.0.0.1:8080/)
          grep --ignore-case "^content-security-policy: default-src 'self'; script-src 'self';" page-headers.txt
          [[ "${page}" == *'<div id="app">'* ]]
          script=$(sed -n 's/.*src="\.\/\(assets\/[^"]*\.js\)".*/\1/p' <<< "${page}")
          echo "${script}"
          curl --silent --fail --output /dev/null "http://127.0.0.1:8080/${script}"

          echo "The server stops cleanly when asked"
          docker stop --time 10 organizr-smoke
          [[ "$(docker inspect --format '{{.State.ExitCode}}' organizr-smoke)" == "0" ]]
          docker rm organizr-smoke

      # A finding without a correction does not stop the run: nothing can be done about
      # it here. The weekly scan of the published image reports each finding.
      # The scanner reads a saved copy of the image, so it gets no access to Docker.
      - name: Scan the image for vulnerabilities that have a correction
        run: |
          docker save "${IMAGE}" --output "${RUNNER_TEMP}/image.tar"
          docker run --rm -v "${RUNNER_TEMP}/image.tar:/image.tar:ro" \
            ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress --input /image.tar
          rm "${RUNNER_TEMP}/image.tar"

      - name: Log in to the registry
        if: steps.prep.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The layers come from the cache of the build above, so this is the image that was
      # tested. The image carries its software list (SBOM) and the record of its build
      # (provenance), which `docker buildx imagetools inspect` shows.
      - name: Push the tested image
        id: push
        if: steps.prep.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          platforms: ${{ steps.prep.outputs.platform }}
          cache-from: ${{ steps.prep.outputs.cache }}
          tags: ${{ steps.prep.outputs.registry_image }}:${{ steps.prep.outputs.channel }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.prep.outputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-only

      # The publish job joins the images by the digests that were pushed here, not by the
      # tags, which another push could move in between.
      - name: Note the digest of the pushed image
        if: steps.prep.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          [[ "${DIGEST}" == sha256:* ]]
          mkdir -p "${RUNNER_TEMP}/digest"
          echo "${DIGEST}" > "${RUNNER_TEMP}/digest/${ARCHITECTURE}"

      - name: Keep the digest for the publish job
        if: steps.prep.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digest/${{ matrix.architecture }}
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish the image for both architectures
    needs: build
    if: needs.build.outputs.channel != 'none' && needs.build.outputs.channel != ''
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - name: Fetch the digests of the pushed images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb

      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the two images under one name
        env:
          CHANNEL: ${{ needs.build.outputs.channel }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          amd64=$(cat "${RUNNER_TEMP}/digests/linux-amd64")
          arm64=$(cat "${RUNNER_TEMP}/digests/linux-arm64")
          [[ "${amd64}" == sha256:* && "${arm64}" == sha256:* ]]
          tags=(--tag "${image}:${CHANNEL}")
          # A release also has the name of its version. That tag never moves: when it
          # exists already, this run publishes :latest only.
          if [[ "${CHANNEL}" == latest ]]; then
            if docker buildx imagetools inspect "${image}:${VERSION}" > /dev/null 2>&1; then
              echo "::warning::${image}:${VERSION} exists and stays as it is. Raise the version for a new release."
            else
              tags+=(--tag "${image}:${VERSION}")
            fi
          fi
          docker buildx imagetools create "${tags[@]}" "${image}@${amd64}" "${image}@${arm64}"

          platforms=$(docker buildx imagetools inspect "${image}:${CHANNEL}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "${platforms}"
          [[ "${platforms}" == *linux/amd64* && "${platforms}" == *linux/arm64* ]]
