name: build

# Builds the image for both architectures, tests that it starts, and publishes it.
# It runs once a day when the branch has commits that no earlier run built, on request,
# and for a pull request to main that changes a file of the image.
# Only a run for the branch develop publishes: ghcr.io/<owner>/<repository>:develop.
on:
  schedule:
    - cron: "7 12 * * *"
  pull_request:
    branches:
      - main
    paths:
      - docker/**
      - crates/**
      - web/**
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Look for commits that no run built
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    outputs:
      build: ${{ steps.look.outputs.build }}
    steps:
      - name: Compare the commit with the last run that built the branch
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          if [[ "${GITHUB_EVENT_NAME}" == schedule ]]; then
            # A run for a pull request has the same branch name and publishes nothing.
            built=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow build.yml \
              --branch "${GITHUB_REF_NAME}" --status success --limit 30 \
              --json headSha,event \
              --jq '[.[] | select(.event != "pull_request")][0].headSha // ""') || built=""
            echo "This commit:      ${GITHUB_SHA}"
            echo "Last one built:   ${built:-none}"
            if [[ "${built}" == "${GITHUB_SHA}" ]]; then
              build=false
            fi
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test the image (${{ matrix.architecture }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - architecture: linux-amd64
            runner: ubuntu-26.04
          - architecture: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: organizr-smoke-test:${{ matrix.architecture }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check that the Dockerfile and rust-toolchain.toml name the same Rust version
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          image=$(sed -n 's/^ARG RUST_IMAGE=rust:\([0-9.]*\)-.*$/\1/p' docker/Dockerfile)
          echo "rust-toolchain.toml: ${toolchain}"
          echo "docker/Dockerfile:   ${image}"
          if [[ -z "${toolchain}" || "${toolchain}" != "${image}" ]]; then
            echo "::error::The Rust versions differ. Update both files together."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          version: v0.39.0
          driver-opts: image=moby/buildkit:v0.35.0

      - name: Prepare
        id: prep
        run: |
          # GITHUB_REF_NAME is N/merge on pull requests, which has no cache of its own
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            CACHE_REF_NAME="${GITHUB_BASE_REF}"
          else
            CACHE_REF_NAME="${GITHUB_REF_NAME}"
          fi
          # Only a run for the branch develop publishes, and never a run for a pull request
          if [[ "${GITHUB_REF}" == refs/heads/develop && "${GITHUB_EVENT_NAME}" != pull_request ]]; then
            PUBLISH=true
          else
            PUBLISH=false
          fi
          ARCHITECTURE=${{ matrix.architecture }}
          {
            echo "publish=${PUBLISH}"
            echo "registry_image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "platform=${ARCHITECTURE//-/\/}"
            echo "cache=type=gha,scope=${CACHE_REF_NAME}-${ARCHITECTURE}"
            echo "version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          } >> "$GITHUB_OUTPUT"

      - name: Build for testing
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          platforms: ${{ steps.prep.outputs.platform }}
          cache-from: ${{ steps.prep.outputs.cache }}
          cache-to: ${{ steps.prep.outputs.cache }},mode=max
          tags: ${{ env.IMAGE }}

      - name: Smoke test
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          PLATFORM: ${{ steps.prep.outputs.platform }}
        run: |
          set -euo pipefail

          echo "The binary starts and reports the version of the workspace"
          output=$(docker run --rm "${IMAGE}" --version)
          echo "${output}"
          [[ "${output}" == "organizr ${VERSION}" ]]

          echo "The image is for ${PLATFORM}"
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE}")" == "${PLATFORM}" ]]

          echo "The image does not run as root"
          [[ "$(docker image inspect --format '{{.Config.User}}' "${IMAGE}")" == "65532:65532" ]]

          echo "The server starts and becomes healthy"
          docker run --detach --name organizr-smoke --publish 127.0.0.1:8080:8080 "${IMAGE}"
          health=starting
          for _ in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' organizr-smoke)
            if [[ "${health}" != "starting" ]]; then break; fi
            sleep 2
          done
          docker logs organizr-smoke
          [[ "${health}" == "healthy" ]]

          echo "The server answers the ping"
          answer=$(curl --silent --fail http://127.0.0.1:8080/api/v2/ping | tr -d '[:space:]')
          echo "${answer}"
          [[ "${answer}" == '{"response":{"result":"success","message":null,"data":"pong"}}' ]]

          echo "The server hands out the web interface with its security policy"
          page=$(curl --silent --fail --dump-header page-headers.txt http://127.0.0.1:8080/)
          grep --ignore-case "^content-security-policy: default-src 'self'; script-src 'self';" page-headers.txt
          [[ "${page}" == *'<div id="app">'* ]]
          script=$(sed -n 's/.*src="\.\/\(assets\/[^"]*\.js\)".*/\1/p' <<< "${page}")
          echo "${script}"
          curl --silent --fail --output /dev/null "http://127.0.0.1:8080/${script}"

          echo "The server stops cleanly when asked"
          docker stop --time 10 organizr-smoke
          [[ "$(docker inspect --format '{{.State.ExitCode}}' organizr-smoke)" == "0" ]]
          docker rm organizr-smoke

      - name: Log in to the registry
        if: steps.prep.outputs.publish == 'true'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The layers come from the cache of the build above, so this is the image that was tested.
      # The software list and the build record come with the release pipeline.
      - name: Push the tested image
        if: steps.prep.outputs.publish == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          provenance: false
          sbom: false
          platforms: ${{ steps.prep.outputs.platform }}
          cache-from: ${{ steps.prep.outputs.cache }}
          tags: ${{ steps.prep.outputs.registry_image }}:develop-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    name: Publish the image for both architectures
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          version: v0.39.0
          driver-opts: image=moby/buildkit:v0.35.0

      - name: Log in to the registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the two images under one name
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "${image}:develop" \
            "${image}:develop-linux-amd64" "${image}:develop-linux-arm64"

          platforms=$(docker buildx imagetools inspect "${image}:develop" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "${platforms}"
          [[ "${platforms}" == *linux/amd64* && "${platforms}" == *linux/arm64* ]]
