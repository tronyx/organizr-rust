name: ci

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache the cargo registry and build output
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy with warnings as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run the tests
        run: cargo test --workspace --locked

  deny:
    name: Advisories, licences and banned crates
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2.1.2
