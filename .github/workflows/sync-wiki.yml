name: Sync the wiki

# Copies docs/ to the repository's wiki whenever a push to develop changes
# it, so the wiki describes the image with the tag develop. docs/ is the
# source: the wiki is replaced on every sync, and a footer on each page says
# so. Only link targets change on the way (see .github/scripts/docs_to_wiki.py,
# tested in .github/scripts/test_docs.py): links between pages lose their
# .md, docs/README.md becomes the wiki's Home page, and links out of docs/
# point at develop's files on GitHub.
#
# No third-party action: just the checkout, Python and git, since this job
# can write to the repository.
#
# The wiki has to exist before a sync can push: turn on Wikis in the
# repository's settings, with editing restricted to collaborators, and save
# one page in the Wiki tab, which creates the wiki's git repository. The
# first sync replaces that page. Until then the job only says that the wiki
# is missing.
on:
  push:
    branches: [develop]
    paths:
      - docs/**
      - .github/scripts/docs_to_wiki.py
      - .github/workflows/sync-wiki.yml
  workflow_dispatch:

permissions:
  contents: read

# One sync at a time, so two pushes close together can't push over each other.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Copy docs/ to the wiki
    if: github.repository == 'tronyx/organizr-rust' && github.ref_name == 'develop'
    runs-on: ubuntu-26.04
    permissions:
      # The token pushes to the wiki, which needs write access to contents.
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone the wiki
        id: wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The wiki does not exist yet. Turn on Wikis and save one page, then run this workflow again."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy docs/ into it
        if: steps.wiki.outputs.exists == 'true'
        run: python3 .github/scripts/docs_to_wiki.py docs "$RUNNER_TEMP/wiki" "https://github.com/$GITHUB_REPOSITORY" develop

      - name: Push the changes, if there are any
        if: steps.wiki.outputs.exists == 'true'
        working-directory: ${{ runner.temp }}/wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git diff --cached --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Sync from docs/ at ${GITHUB_SHA::7}"
          git push -q
