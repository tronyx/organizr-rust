[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
repository = "https://github.com/tronyx/organizr-rust"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.cargo]
# A dependency that no code uses fails the build.
unused_dependencies = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# No panics in production paths. Tests are exempt through clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
# Pedantic lints that cost more than they give in an application.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

# A dependency is added here when the first crate needs it.
# docs/architecture.md, section 5, lists the full planned set and its versions.
[workspace.dependencies]
clap = { version = "4.6.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
