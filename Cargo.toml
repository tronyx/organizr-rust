[workspace]
resolver = "3"
members = ["crates/*"]
# The example extension is built for WebAssembly, with a lock file of its own.
exclude = ["examples"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
repository = "https://github.com/tronyx/organizr-rust"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.cargo]
# A dependency that no code uses fails the build.
unused_dependencies = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# No panics in production paths. Tests are exempt through clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
# Pedantic lints that cost more than they give in an application.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

# A dependency is added here when the first crate needs it.
# docs/architecture.md, section 5, lists the full planned set and its versions.
[workspace.dependencies]
organizr-api = { path = "crates/api" }
organizr-auth = { path = "crates/auth" }
organizr-db = { path = "crates/db" }
organizr-domain = { path = "crates/domain" }
organizr-import = { path = "crates/import" }
organizr-integrations = { path = "crates/integrations" }
organizr-plugins = { path = "crates/plugins" }
organizr-settings = { path = "crates/settings" }
organizr-testkit = { path = "crates/testkit" }

aes = "0.9.4"
anyhow = "1.0.104"
arc-swap = "1.9.5"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
bcrypt = "0.19.3"
cbc = { version = "0.2.1", features = ["alloc"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
http-body-util = "0.1.5"
ipnet = "2.12.2"
jiff = "1.0.1"
# The LDAP back end of the login. TLS through rustls with the ring provider.
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls", "ring", "rustls-native-certs"] }
md-5 = "0.11.0"
# The OpenID Connect login. Without its own HTTP client: it sends its requests through
# the reqwest client of this application.
openidconnect = { version = "4.1.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "query"] }
roxmltree = "0.21.2"
rust-embed = "8.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.5"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
# The FTP back end of the login: asynchronous, with TLS through rustls and ring.
suppaftp = { version = "13.0.0", default-features = false, features = ["tokio-rustls-ring"] }
surge-ping = "0.9.1"
tempfile = "3.27"
# The runtime for extensions. It is the line with long support.
wasmtime = { version = "48.0.10", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "48.0.10", default-features = false, features = ["p2"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["macros", "rt"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
totp-rs = { version = "6.0.0", features = ["otpauth", "qr", "gen_secret", "zeroize"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["csrf", "set-header"] }
tracing = "0.1.44"
uuid = { version = "1.29", features = ["v4"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.2"

# The shipped binary: link-time optimisation and no debug symbols.
[profile.release]
lto = "thin"
strip = true

# The test binaries are many, and each one links every dependency. With the full debug
# information they fill the disk of a build machine, and the linker then crashes. Line
# numbers for our own code are enough for a backtrace.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
