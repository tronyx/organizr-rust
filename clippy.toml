# The workspace denies these lints in production code. Tests may use them.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Names of products that are no code. ".." keeps the names that clippy knows already.
doc-valid-idents = ["AdGuard", "BreezoMeter", "CouchPotato", "JDownloader", "JellyStat", "LibreSpeed", "NZBGet", "OctoPrint", "OpenID", "PocketID", "PromPage", "SABnzbd", "SickRage", "UniFi", "YouTube", ".."]
